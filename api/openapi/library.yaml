# The library module's contract: saving links, listing them by location,
# counts, detail, patch and the "opened" call.
#
# Both the Go server interfaces and the TypeScript types come from this file --
# `bin/generate` runs the generators -- so changing what the API accepts or
# returns means changing the contract first. The generated interface then turns
# a missing handler into a compile error, and a handler can only exist for a
# route named here.
#
# A path in this file must sit under /api/library/. Every object schema pins
# additionalProperties to false, so a request carrying a field the contract
# never named is rejected instead of being silently dropped. `bin/check-contracts`
# is what enforces both.
openapi: 3.0.3
info:
  title: Norte library API
  version: 0.1.0
  description: |
    The library is where saved links live: one save puts a link in the inbox
    with the reason it was kept, saving the same link twice keeps one copy,
    and the list, counts and search read it back by view, kind, unread state
    and full text.
paths:
  /api/library/items:
    post:
      operationId: saveLibraryItem
      summary: Save a link to the library
      description: |
        Stores the HTML snapshot when one came with the request, then records
        the item, its registry row, its file reference, its links and its
        extraction job in one transaction. A save whose canonical URL already
        exists answers 200 with the existing id and applies the new note,
        selection and links instead of creating a second copy. The source of a
        save is decided by the adapter, never by the request: a request without
        a source is recorded as coming from Norte's own dialog, and the only
        source a request may carry is the browser extension's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveItemRequest"
      responses:
        "201":
          description: The save created an item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResponse"
        "200":
          description: The canonical URL was already saved; the existing item, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listLibraryItems
      summary: List saved links
      description: |
        Summaries, never the extracted HTML or text. Every sort is a total
        order with the id breaking ties. The cursor encodes the sort position
        and a hash of the filters, and a cursor presented with different
        filters or sort is refused. With q the order is the full-text rank,
        then id, and an explicit sort together with q is refused.

        view=suggestions is not a location: it reads every location and
        orders items by how closely they relate to what the person is focused
        on, listing unread before read within one score. It carries its own
        order, so it refuses q and an explicit sort; unread is an ordinary
        filter under it, and unread=false is accepted.
      parameters:
        - name: view
          in: query
          description: |
            Which location to read; all is every location, and suggestions is
            the focus-ranked list over every location rather than a location
            of its own.
          schema:
            $ref: "#/components/schemas/LibraryView"
            default: inbox
        - name: kind
          in: query
          description: Keep only this kind.
          schema:
            $ref: "#/components/schemas/ItemKind"
        - name: unread
          in: query
          description: Keep only unread items, or only read ones.
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            The order. last_opened_desc lists only items that have been
            opened, newest-opened first, and is what the home's "Continue
            reading" block reads.
          schema:
            $ref: "#/components/schemas/LibrarySort"
            default: saved_desc
        - name: q
          in: query
          description: Full-text query over the title, the note and the extracted text.
          schema:
            type: string
        - name: cursor
          in: query
          description: The next_cursor of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: How many summaries a page holds.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemList"
        default:
          $ref: "#/components/responses/Error"
  /api/library/counts:
    get:
      operationId: getLibraryCounts
      summary: Count the library by view, kind and unread state
      description: |
        Every count the library screen shows, in one query, so a list call
        never recomputes them.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCounts"
        default:
          $ref: "#/components/responses/Error"
  /api/library/items/random:
    get:
      operationId: drawLibraryItems
      summary: Draw a random unread item
      description: |
        The serendipity button: one unread item, drawn at random, for the
        moment when nothing on the shelf appeals. With away_from_focus the draw
        is weighted by 1 / (1 + focus score), so an item unrelated to what the
        person is focused on is the likelier one -- which is the point, the
        focused ones already having the Suggestions view. With away_from_focus false
        every unread item is equally likely.

        This path is declared before /api/library/items/{id} because the two
        overlap: a router that matched the wildcard first would validate a draw
        against the detail endpoint.

        Draws are with replacement, so the same item may come back twice in one
        answer; with a seed the whole answer is reproducible, which is what
        makes the weighting testable. A library with no unread item answers 404.
      parameters:
        - name: away_from_focus
          in: query
          description: Weight the draw away from the focus, rather than drawing uniformly.
          schema:
            type: boolean
            default: true
        - name: n
          in: query
          description: |
            How many draws this call makes, from 1 to 100. Anything outside
            that range is refused; the range is the service's, so the message
            names it.
          schema:
            type: integer
        - name: seed
          in: query
          description: |
            Makes the draw reproducible: the same seed over the same data draws
            the same items. Without one the draw uses a fresh source.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The items drawn, in draw order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDraw"
        default:
          $ref: "#/components/responses/Error"
  /api/library/items/{id}:
    get:
      operationId: getLibraryItem
      summary: Read one saved link in full
      description: |
        The whole record, including the extracted text when extraction has
        produced it. A read never writes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchLibraryItem
      summary: Change a saved link
      description: |
        Only the fields present are applied. Setting unread records or clears
        the read event; retitling marks the title as the person's own and
        follows the registry row; retyping follows the registry type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchItemRequest"
      responses:
        "200":
          description: The item after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        default:
          $ref: "#/components/responses/Error"
  /api/library/items/{id}/extract:
    post:
      operationId: extractLibraryItem
      summary: Extract a saved link's article text again
      description: |
        Puts the item back to pending and enqueues the background extraction,
        which is how a failed extraction is retried from the reader. The answer
        comes back as soon as the job is queued; it never waits for the text.
        With refresh true the page is downloaded again and the new HTML becomes
        the item's snapshot, which is what to use when the saved snapshot is the
        problem rather than the extraction of it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractItemRequest"
      responses:
        "202":
          description: The extraction was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractItemResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/library/items/{id}/open:
    post:
      operationId: openLibraryItem
      summary: Record that a saved link was opened
      description: |
        Sets when the item was last opened. Opening is not reading: unread is
        left exactly as it was.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The item after the opening was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: |
        Every failure in one envelope, whether it came from validating the
        request against this contract or from the domain behind it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ItemKind:
      type: string
      description: |
        What the saved link is. A save always starts as an article; only a
        patch retypes.
      enum:
        - article
        - book
        - paper
        - video
        - podcast
        - newsletter
        - course
    ItemLocation:
      type: string
      description: Which location the item sits in.
      enum:
        - inbox
        - up_next
        - later
        - archive
        - stash
    ItemSource:
      type: string
      description: Where the save came from.
      enum:
        - app
        - extension
        - cli
        - telegram
        - import
    LibraryView:
      type: string
      description: |
        Which location a list reads; all is every location. suggestions is not
        a location but the focus-ranked list over every one of them, unread
        before read within a score, which is why it sits here rather than in
        ItemLocation: a location is something an item is in, and suggestions is
        a way of looking at the library. It carries its own order and so
        refuses q and an explicit sort, but unread filters it like any other
        view.
      enum:
        - inbox
        - up_next
        - later
        - archive
        - stash
        - all
        - suggestions
    LibrarySort:
      type: string
      description: The order a list comes back in.
      enum:
        - saved_desc
        - saved_asc
        - title
        - last_opened_desc
    ExtractStatus:
      type: string
      description: Where the background extraction of this item stands.
      enum:
        - pending
        - done
        - failed
    TextSelection:
      type: object
      additionalProperties: false
      description: The passage selected when the link was saved, if any.
      properties:
        exact:
          type: string
        prefix:
          type: string
        suffix:
          type: string
    ReadPosition:
      type: object
      additionalProperties: false
      description: Where the person stopped reading.
      properties:
        v:
          type: integer
        anchor:
          type: string
        percent:
          type: number
    SaveItemRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          description: The saved page's address, absolute and http or https.
        title:
          type: string
          description: The tab title, used until extraction gives a better one.
        html:
          type: string
          description: The page's HTML snapshot, when the saver captured one.
        selection:
          $ref: "#/components/schemas/TextSelection"
        reason:
          type: string
          description: The reason this link was worth keeping.
        link_to:
          type: array
          description: Registry ids this item is about; unknown ids refuse the save.
          items:
            type: string
        source:
          type: string
          description: |
            The only source a request may carry is the browser extension's;
            anything else is refused, and an absent source is Norte's own dialog.
          enum:
            - extension
    SaveItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: The saved item, new or already there.
    ExtractItemRequest:
      type: object
      additionalProperties: false
      properties:
        refresh:
          type: boolean
          description: |
            Download the page again instead of re-reading the stored snapshot,
            and make the new HTML the item's snapshot.
    ExtractItemResponse:
      type: object
      additionalProperties: false
      required:
        - item_id
        - job_id
        - extract_generation
      properties:
        item_id:
          type: string
        job_id:
          type: string
          description: The queued job, so a failure can be found in `norte jobs list`.
        extract_generation:
          type: integer
          description: |
            The generation this retry runs under. Any run still in flight under
            an older one is superseded and writes nothing.
    LibraryItemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - url
        - canonical_url
        - title
        - title_edited
        - location
        - unread
        - saved_at
        - source
        - extract_status
        - extract_generation
        - created_at
        - updated_at
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        url:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        title_edited:
          type: boolean
          description: True once the person overrode the extracted title.
        author:
          type: string
        site:
          type: string
        published_at:
          type: string
        lead_image:
          type: string
        reason:
          type: string
        selection:
          $ref: "#/components/schemas/TextSelection"
        location:
          $ref: "#/components/schemas/ItemLocation"
        unread:
          type: boolean
        saved_at:
          type: string
        read_at:
          type: string
        last_opened_at:
          type: string
        read_position:
          $ref: "#/components/schemas/ReadPosition"
        source:
          $ref: "#/components/schemas/ItemSource"
        html_hash:
          type: string
          description: The snapshot blob in the file store, when one was captured.
        content_headings:
          type: string
        extract_status:
          $ref: "#/components/schemas/ExtractStatus"
        extract_generation:
          type: integer
          description: |
            Bumped by every save that enqueues a new extraction, so the worker
            can tell a superseded job from the current one.
        extracted_at:
          type: string
        extract_error:
          type: string
        minutes:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    LibraryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - url
        - canonical_url
        - title
        - title_edited
        - location
        - unread
        - saved_at
        - source
        - extract_status
        - extract_generation
        - created_at
        - updated_at
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        url:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        title_edited:
          type: boolean
          description: True once the person overrode the extracted title.
        author:
          type: string
        site:
          type: string
        published_at:
          type: string
        lead_image:
          type: string
        reason:
          type: string
        selection:
          $ref: "#/components/schemas/TextSelection"
        location:
          $ref: "#/components/schemas/ItemLocation"
        unread:
          type: boolean
        saved_at:
          type: string
        read_at:
          type: string
        last_opened_at:
          type: string
        read_position:
          $ref: "#/components/schemas/ReadPosition"
        source:
          $ref: "#/components/schemas/ItemSource"
        html_hash:
          type: string
          description: The snapshot blob in the file store, when one was captured.
        content_html:
          type: string
        content_text:
          type: string
        content_headings:
          type: string
        extract_status:
          $ref: "#/components/schemas/ExtractStatus"
        extract_generation:
          type: integer
          description: |
            Bumped by every save that enqueues a new extraction, so the worker
            can tell a superseded job from the current one.
        extracted_at:
          type: string
        extract_error:
          type: string
        minutes:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    LibraryItemList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItemSummary"
        next_cursor:
          type: string
          description: The cursor for the following page, absent on the last one.
    LibraryDraw:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: |
            One summary per draw, in the order they were drawn. Draws are with
            replacement, so an id may appear more than once.
          items:
            $ref: "#/components/schemas/LibraryItemSummary"
    LibraryCounts:
      type: object
      additionalProperties: false
      required:
        - views
        - kinds
        - unread
      properties:
        views:
          type: object
          additionalProperties: false
          required:
            - inbox
            - up_next
            - later
            - archive
            - stash
            - all
          properties:
            inbox:
              type: integer
            up_next:
              type: integer
            later:
              type: integer
            archive:
              type: integer
            stash:
              type: integer
            all:
              type: integer
        kinds:
          type: object
          additionalProperties: false
          required:
            - article
            - book
            - paper
            - video
            - podcast
            - newsletter
            - course
          properties:
            article:
              type: integer
            book:
              type: integer
            paper:
              type: integer
            video:
              type: integer
            podcast:
              type: integer
            newsletter:
              type: integer
            course:
              type: integer
        unread:
          type: integer
          description: Items still unread, over every view.
    PatchItemRequest:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: "#/components/schemas/ItemLocation"
        unread:
          type: boolean
        reason:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          minLength: 1
        read_position:
          $ref: "#/components/schemas/ReadPosition"
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable reason. The frontend branches on this;
            the message is for a person.
          example: invalid_request
        message:
          type: string
          description: What went wrong, in one sentence, safe to show.
        field:
          type: string
          description: |
            The input the failure is attributable to, when it is attributable
            to exactly one. Absent otherwise.
          example: kind
        request_id:
          type: string
          description: |
            The X-Request-Id of the request that failed, so an error a person
            reports can be matched to the log line that recorded it.
