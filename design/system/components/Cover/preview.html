<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--norte); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--norte-soft); }
  .mark { fill:var(--lime); }
  .blk { rx:var(--radius-md); }
  .cell { rx:var(--radius-xs); }
  .s1 { fill:var(--streak-1); } .s2 { fill:var(--streak-2); } .s3 { fill:var(--streak-3); } .s4 { fill:var(--streak-4); }
  .words { position:absolute; left:var(--space-11); bottom:var(--space-9); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:750; letter-spacing:-0.045em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:22px; color:var(--muted); }
</style>
</head>

   pattern     the streak grid, from "study history as a grid of days": 12px cells at a space-4 pitch in the streak-1…4 ramp, level-0 days cut out of the tint, one week cut into the ink block
