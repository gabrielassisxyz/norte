<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TextField — preview</title>
<style>#root { padding: 24px;  } </style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 20, maxWidth: 420 } },
    h(N.TextField, { label: 'Nova anotação', multiline: true, placeholder: 'Uma ideia sobre o texto como um todo, ou selecione um trecho…' }),
    h(N.TextField, { label: 'Minha previsão', inline: true, mono: true, defaultValue: '70%', width: 88, hint: 'Teste em 9 out' }))
  );
</script>
</body>
</html>
