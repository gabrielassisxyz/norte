<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title>
<style>#root { padding: 24px;  } </style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 20, maxWidth: 420 } },
    h(N.TextField, { label: 'New annotation', multiline: true, placeholder: 'An idea about the whole piece, or select a passage...' }),
    h(N.TextField, { label: 'My forecast', inline: true, mono: true, defaultValue: '70%', width: 88, hint: 'Quiz on Oct 9' }))
  );
</script>
</body>
