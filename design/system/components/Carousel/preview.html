<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 560, margin: '0 24px' } },
    h(N.Carousel, { itemWidth: 160, visible: 3, step: 1, arrowTop: 40, label: 'Trails' },
      ['Compilers', 'Math for ML', 'Guitar harmony', 'Distributed systems', 'Typography'].map(function (t) { return h(N.CoverCard, { key: t, title: t, coverHeight: 112 }); })))

</script>
