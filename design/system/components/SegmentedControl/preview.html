<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl — preview</title>
<style>#root { padding: 24px;  } </style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'nt-row', style: { gap: 24 } },
    h(N.SegmentedControl, { label: 'Mode', options: [{ value: 'reading', label: 'Reading' }, { value: 'ex', label: 'Exercises', count: '1/3' }] }),
    h(N.SegmentedControl, { label: 'View', defaultValue: 'table', options: [{ value: 'covers', label: 'Covers' }, { value: 'table', label: 'Table' }] }))
  );
</script>
</body>
</html>
