<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button — preview</title>
<style>#root { padding: 24px;  }</style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'nt-stack' },
    h('div', { className: 'nt-row' }, h(N.Button, { variant: 'primary', icon: 'play' }, 'Começar revisão'), h(N.Button, null, 'Adicionar nota'), h(N.Button, { variant: 'ghost', icon: 'plus' }, 'Nova pergunta'), h(N.Button, { disabled: true }, 'Arquivar')),
    h('div', { className: 'nt-row' }, h(N.Button, { variant: 'primary', size: 'sm' }, 'Marcar como feito'), h(N.Button, { size: 'sm' }, 'Pular'), h(N.Button, { variant: 'ghost', size: 'sm' }, 'Desfazer')))
  );
</script>
</body>
</html>
