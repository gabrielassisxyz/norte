<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title>
<style>#root { padding: 24px;  }</style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'nt-stack' },
    h('div', { className: 'nt-row' }, h(N.Button, { variant: 'primary', icon: 'play' }, 'Start review'), h(N.Button, null, 'Add note'), h(N.Button, { variant: 'ghost', icon: 'plus' }, 'New question'), h(N.Button, { disabled: true }, 'Archive')),
    h('div', { className: 'nt-row' }, h(N.Button, { variant: 'primary', size: 'sm' }, 'Mark as done'), h(N.Button, { size: 'sm' }, 'Skip'), h(N.Button, { variant: 'ghost', size: 'sm' }, 'Undo')))
  );
</script>
</body>
</html>
