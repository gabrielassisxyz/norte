<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>NavItem — preview</title>
<style>#root { padding: 24px; padding: 0 } </style>
</head>
<body>
<div id="root"></div>
<script>
  var N = window.Norte, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
  h('nav', { 'aria-label': 'Principal', style: { width: 232, padding: 16, background: 'var(--sunken)', display: 'grid', gap: 2, boxSizing: 'border-box' } },
    h(N.NavItem, { label: 'Início', active: true }),
    h(N.NavItem, { label: 'Currículos', count: 12 }),
    h(N.NavItem, { label: 'Assuntos', count: 6 }),
    h(N.NavItem, { label: 'Revisão', count: 24 }),
    h(N.NavItem, { label: 'Notas', count: 230 }))
  );
</script>
</body>
</html>
