<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Save to Norte</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Norte</strong><a href="settings.html" target="_blank">Settings</a></header>
<main>
<h1 id="title">Save the page</h1>
<p id="status" role="status" aria-live="polite"></p>
<a id="configure" href="settings.html" target="_blank" hidden>configure the server</a>
<div id="actions" class="row" hidden>
<button id="open" type="button">Open <svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2h5v5"></path><path d="M14 2 7.5 8.5"></path><path d="M12 9.5V14H2V4h4.5"></path></svg></button>
<button id="delete" type="button" class="danger">Delete</button>
</div>
<div id="confirm" hidden>
<p id="confirm-question">Delete this item?</p>
<div class="row">
<button id="confirm-delete" type="button" class="danger">Delete</button>
<button id="cancel-delete" type="button" class="quiet">Keep</button>
</div>
</div>
<button id="retry" type="button" hidden>Retry</button>
<div id="editor" hidden>
<label for="reason">Why am I saving this? <span>(optional)</span></label>
<textarea id="reason" rows="5" maxlength="10000" autocomplete="off" placeholder="Why am I saving this?"></textarea>
<p id="reason-state" class="muted" role="status" aria-live="polite"></p>
<label for="subject">Link to a subject <span>(optional)</span></label>
<input id="subject" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="subject-options"
  aria-label="Link to a subject" placeholder="Search for a subject" autocomplete="off">
<ul id="subject-options" role="listbox" aria-label="Subjects" hidden></ul>
<p id="subject-state" class="muted" role="status"></p>
<ul id="chips" aria-label="Linked subjects"></ul>
</div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
