<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Salvar no Norte</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Norte</strong><a href="settings.html" target="_blank">Configurações</a></header>
<main>
<h1 id="title">Salvar página</h1>
<form id="save-form">
<label for="reason">Por que salvei <span>(opcional)</span></label>
<input id="reason" maxlength="10000" autocomplete="off" placeholder="O que vale lembrar?">
<label for="search">Vincular a um assunto ou foco <span>(opcional)</span></label>
<input id="search" type="search" placeholder="Buscar assunto" autocomplete="off">
<select id="link" aria-label="Assunto ou foco"><option value="">Sem vínculo</option></select>
<p id="targets-status" class="muted" role="status"></p>
<button id="save" type="submit" autofocus>Salvar</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<a id="configure" href="settings.html" target="_blank" hidden>configure o servidor</a>
<a id="reader" target="_blank" hidden>Abrir na biblioteca</a>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
