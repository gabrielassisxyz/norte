<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Configure Norte</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Norte</strong></header>
<main>
<h1>Connect to the server</h1>
<p>Use Norte's address on your computer or your network.</p>
<form id="settings-form">
<label for="origin">Server address</label>
<input id="origin" type="url" required placeholder="http://127.0.0.1:8080">
<button type="submit" id="connect">Connect</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="settings-page.js"></script>
</body>
</html>
